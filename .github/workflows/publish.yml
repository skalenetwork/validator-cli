name: Build and publish
on:
  pull_request:
    types: [closed]
    branches:
      - master
      - develop
      - beta
      - stable

jobs:
  create_release:
    if: github.event.pull_request.merged
    name: Create release
    runs-on: ubuntu-20.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.export_outputs.outputs.version }}
      branch: ${{ steps.export_outputs.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set Versions
        run: |
          bash ./scripts/set_versions_ga.sh
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: ${{ env.VERSION }}
          draft: false
          prerelease: true
      - name: Export outputs
        id: export_outputs
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  build_and_publish:
    if: github.event.pull_request.merged
    needs: create_release
    name: Build and publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # nixpkgs-unstable no longer evaluates x86_64-darwin, so macos-13
      # (Intel macOS) is intentionally not built by this release matrix.
      matrix:
        include:
          - os: ubuntu-20.04
            asset_name: sk-val-${{ needs.create_release.outputs.version }}-Linux-x86_64
          - os: ubuntu-24.04-arm
            asset_name: sk-val-${{ needs.create_release.outputs.version }}-Linux-aarch64
          - os: macos-14
            asset_name: sk-val-${{ needs.create_release.outputs.version }}-Darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout submodules
        run: git submodule update --init

      ## Nix dev shell supplies swig + openssl (m2crypto) and uv on all platforms.
      ## Docker image pulls the platform-native architecture, so no cross-compilation needed.
      - name: Build binary
        env:
          VERSION: ${{ needs.create_release.outputs.version }}
          BRANCH: ${{ needs.create_release.outputs.branch }}
        run: |
          nix develop --command bash scripts/build_nix.sh "$VERSION" "$BRANCH"
          if [[ "$(uname)" == "Darwin" ]]; then
            shasum -a 512 dist/${{ matrix.asset_name }} | tee > /dev/null dist/sha512sum
          else
            sha512sum dist/${{ matrix.asset_name }} | tee > /dev/null dist/sha512sum
          fi

      - name: Upload release binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist/${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream

      - name: Upload release checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: dist/sha512sum
          asset_name: ${{ matrix.asset_name }}.sha512
          asset_content_type: text/plain
