name: Build and publish

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - beta
      - stable

permissions:
  contents: read

jobs:
  version:
    if: github.event.pull_request.merged
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Calculate version
        id: version
        env:
          BRANCH: ${{ github.base_ref }}
        run: |
          export VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$(bash ./helper-scripts/calculate_version.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BRANCH: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p ./dist
          docker build . -t validator-cli-builder
          docker run --rm -v "$PWD/dist":/app/dist validator-cli-builder bash scripts/build.sh "$VERSION" "$BRANCH"

      - name: Install uv
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      - name: Build macOS binary
        if: runner.os == 'macOS'
        run: |
          uv sync --extra dev
          uv run bash scripts/build.sh "$VERSION" "$BRANCH"

      - name: Generate checksum
        working-directory: dist
        run: |
          for file in sk-val-*; do
            shasum -a 512 "$file" > "$file.sha512"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: sk-val-${{ runner.os }}
          path: dist/sk-val-*

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.version.outputs.version }}
          prerelease: ${{ github.base_ref != 'stable' }}
          generate_release_notes: true
          files: dist/sk-val-*
