[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validator-cli"
version = "1.3.3"
description = "SKALE validator tools"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "SKALE Labs", email = "support@skalelabs.com" },
]
keywords = ["skale", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.7",
]
requires-python = ">=3.9"
dependencies = [
    "click==7.1.2",
    "skale.py==5.8dev3",
    "yaspin==2.2.0",
    "texttable==1.6.4",
    "pandas==1.5.1",
    "terminaltables==3.1.10",
    "setuptools",
]

[project.optional-dependencies]
linter = [
    "flake8==3.7.9",
    "isort>=4.2.15,<5.4.3",
]
dev = [
    "flake8==3.7.9",
    "isort>=4.2.15,<5.4.3",
    "PyInstaller==5.5",
    "pytest==5.4.2",
    "twine==3.1.1",
    "mock==4.0.2",
    "boto3==1.13.7",
    "pytest-cov==2.9.0",
]

[project.scripts]
sk-val = "cli.main:main"

[project.urls]
Homepage = "https://github.com/skalenetwork/validator-cli"

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.setuptools.package-data]
"utils" = ["text.yml"]

[tool.uv]
override-dependencies = [
    "pyzmq>=25.0.0",
    "M2Crypto>=0.41.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.3",
    "cytoolz>=1.1.0",
    "websockets>=14.0",
    "setuptools<74.0.0",
    "parsimonious>=0.10.0",
]
