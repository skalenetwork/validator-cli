[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "validator-cli"
version = "1.4.0"
requires-python = ">=3.14"
dependencies = [
  "click==8.5.0",
  "PyYAML==6.0.3",
  "skale.py[hw-wallet]==8.0dev0",
  "texttable==1.7.2",
  "yaspin==3.5.1",
]

[project.optional-dependencies]
dev = [
  "PyInstaller==6.22.3",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "utils*"]

[tool.ruff]
line-length = 100
extend-exclude = ["helper-scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"
